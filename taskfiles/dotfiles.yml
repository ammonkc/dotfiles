# taskfiles/dotfiles.yml
version: 3

includes:
  brew:
    taskfile: ./brew.yml
    internal: true

  backup:
    taskfile: ./backup.yml
    internal: true

vars:
  DOTFILES_DIR: '{{.ROOT_DIR}}'
  PACKAGES_DIR: '{{.DOTFILES_DIR}}/packages'
  STOW_FLAGS: '--restow --no-folding'
  # Apple Silicon Homebrew prefix; Linux uses its native PATH.
  BREW_PREFIX:
    sh: |
      if [[ "$(uname)" == "Darwin" ]]; then
        echo "/opt/homebrew"
      else
        echo ""
      fi
  # Dynamically get list of all package directories
  PACKAGES:
    sh: cd {{.PACKAGES_DIR}} && find . -maxdepth 1 -type d ! -name ".*" -exec basename {} \; | sort
  # Dynamically find all .local and *.local.* template files in packages
  LOCAL_FILES:
    sh: cd {{.PACKAGES_DIR}} && find . -type f \( -name "*.local" -o -name "*.local.*" \) | sed 's|^\./||'

tasks:
  # ============================================================================
  # Primary Tasks
  # ============================================================================

  install:
    desc: Install all dotfiles using GNU Stow
    cmds:
      - task: ensure_dirs
      - task: stow:packages
      - task: copy_local_configs

  uninstall:
    desc: Remove dotfile symlinks
    cmds:
      - task: unstow:packages

  list:
    desc: List all available packages
    silent: true
    cmds:
      - echo "📦 Available packages:"
      - for:
          var: PACKAGES
          as: PACKAGE
        cmd: echo "  - {{.PACKAGE}}"

  restow:
    desc: Restow a specific package
    summary: |
      Restow a specific package by name
      Usage: task dot:restow PACKAGE=zsh
    vars:
      PACKAGE: '{{.PACKAGE | default ""}}'
    preconditions:
      - sh: test -n "{{.PACKAGE}}"
        msg: "PACKAGE variable is required. Usage: task dot:restow PACKAGE=zsh"
      - sh: test -d "{{.PACKAGES_DIR}}/{{.PACKAGE}}"
        msg: "Package '{{.PACKAGE}}' not found in {{.PACKAGES_DIR}}"
    cmds:
      - |
        {{if ne .BREW_PREFIX ""}}export PATH="{{.BREW_PREFIX}}/bin:{{.BREW_PREFIX}}/sbin:$PATH"{{end}}
        stow {{.STOW_FLAGS}} --dir={{.PACKAGES_DIR}} -t $HOME "{{.PACKAGE}}"

  # ============================================================================
  # Internal Tasks
  # ============================================================================

  ensure_dirs:
    internal: true
    silent: true
    cmds:
      - mkdir -p ~/.config
      - mkdir -p ~/.ssh
      - mkdir -p ~/.local/{bin,share}

  stow:packages:
    internal: true
    silent: true
    desc: Stow all packages
    preconditions:
      - sh: |
          {{if ne .BREW_PREFIX ""}}export PATH="{{.BREW_PREFIX}}/bin:{{.BREW_PREFIX}}/sbin:$PATH"{{end}}
          command -v stow >/dev/null 2>&1
        msg: "stow is not installed. Run 'task system:install' first to install it, or install stow manually (e.g., 'brew install stow' on macOS or 'sudo apt-get install stow' on Linux)."
    cmds:
      - echo "Stowing packages from {{.PACKAGES_DIR}}..."
      - for:
          var: PACKAGES
          as: PACKAGE
        task: stow:package
        vars:
          PACKAGE: '{{.PACKAGE}}'

  stow:package:
    internal: true
    silent: true
    vars:
      PACKAGE: '{{.PACKAGE}}'
    cmds:
      - echo "  → Stowing {{.PACKAGE}}..."
      - task: backup:backup_conflicts
        vars:
          PACKAGE: '{{.PACKAGE}}'
          PACKAGES_DIR: '{{.PACKAGES_DIR}}'
          STOW_FLAGS: '{{.STOW_FLAGS}}'
      - |
        {{if ne .BREW_PREFIX ""}}export PATH="{{.BREW_PREFIX}}/bin:{{.BREW_PREFIX}}/sbin:$PATH"{{end}}
        stow {{.STOW_FLAGS}} --dir={{.PACKAGES_DIR}} -t $HOME "{{.PACKAGE}}"

  unstow:packages:
    internal: true
    silent: true
    desc: Unstow all packages
    cmds:
      - for:
          var: PACKAGES
          as: PACKAGE
        task: unstow:package
        vars:
          PACKAGE: '{{.PACKAGE}}'

  unstow:package:
    internal: true
    silent: true
    vars:
      PACKAGE: '{{.PACKAGE}}'
    cmds:
      - echo "  → Unstowing {{.PACKAGE}}..."
      - |
        {{if ne .BREW_PREFIX ""}}export PATH="{{.BREW_PREFIX}}/bin:{{.BREW_PREFIX}}/sbin:$PATH"{{end}}
        stow --delete --dir={{.PACKAGES_DIR}} -t $HOME "{{.PACKAGE}}"
      - task: backup:restore_latest_package
        vars:
          PACKAGE: '{{.PACKAGE}}'

  copy_local_configs:
    internal: true
    silent: true
    desc: Copy .local template files from packages to $HOME if they don't exist
    cmds:
      - for:
          var: LOCAL_FILES
          as: LOCAL_FILE
        task: copy_local_file
        vars:
          LOCAL_FILE: '{{.LOCAL_FILE}}'
      - task: copy_local_ssh_config
      - |
        for file in "$HOME/.gitconfig.local" "$HOME/.env.local" "$HOME/.ssh/config"; do
          if [ -f "$file" ]; then chmod 600 "$file"; fi
        done
        chmod 700 "$HOME/.ssh"

  copy_local_file:
    internal: true
    silent: true
    vars:
      LOCAL_FILE: '{{.LOCAL_FILE}}'
      # Extract just the filename (e.g., "zsh/.config/zsh/env.local" -> "env.local")
      FILENAME:
        sh: basename "{{.LOCAL_FILE}}"
      # Always copy to $HOME root with leading dot (e.g., "$HOME/.env.local")
      DEST_FILE: '$HOME/.{{.FILENAME}}'
    status:
      - test -f "{{.DEST_FILE}}"
    cmds:
      - echo "Copying {{.FILENAME}} to {{.DEST_FILE}}..."
      - umask 077 && cp "{{.PACKAGES_DIR}}/{{.LOCAL_FILE}}" "{{.DEST_FILE}}" && chmod 600 "{{.DEST_FILE}}"
      - echo "✓ Created {{.DEST_FILE}} - please customize it"

  copy_local_ssh_config:
    internal: true
    silent: true
    vars:
      SSH_CONFIG_LOCAL: '{{.PACKAGES_DIR}}/ssh/.config/ssh/ssh_config_local'
      DEST_FILE: '$HOME/.ssh/config'
    status:
      - test -f "{{.DEST_FILE}}"
    cmds:
      - cp "{{.SSH_CONFIG_LOCAL}}" "{{.DEST_FILE}}"
      - chmod 600 "{{.DEST_FILE}}"
      - chmod 700 "$HOME/.ssh"
      - echo "✓ Created {{.DEST_FILE}} - please customize it"

  # ============================================================================
  # Launcher Extension Tasks
  # ============================================================================

  raycast:extension:
    desc: Run Raycast IDL Docker extension in development mode
    summary: |
      Installs npm dependencies and starts the IDL Docker extension in Raycast.
      Keep this task running while using the local extension.
    vars:
      EXTENSION_DIR: '{{.ROOT_DIR}}/packages/raycast/extensions/idl-docker'
    preconditions:
      - sh: command -v npm >/dev/null 2>&1
        msg: "npm is not installed. Install Node.js first."
      - sh: test -d "{{.EXTENSION_DIR}}"
        msg: "Raycast extension not found at {{.EXTENSION_DIR}}"
    cmds:
      - echo "📦 Installing Raycast IDL Docker extension..."
      - cd "{{.EXTENSION_DIR}}" && npm install
      - cd "{{.EXTENSION_DIR}}" && npm run dev

  raycast:utilities:
    desc: Register shared Developer Utilities extension with Raycast
    summary: |
      Developer Utilities has one source tree shared by Raycast and Tinycast.
      Installs its dependencies and starts Raycast development mode for local use.
    vars:
      EXTENSION_DIR: '{{.ROOT_DIR}}/packages/raycast/extensions/developer-utilities'
    preconditions:
      - sh: command -v npm >/dev/null 2>&1
        msg: "npm is not installed. Install Node.js first."
      - sh: test -f "{{.EXTENSION_DIR}}/package.json"
        msg: "Developer Utilities extension not found at {{.EXTENSION_DIR}}"
    cmds:
      - cd "{{.EXTENSION_DIR}}" && npm ci
      - cd "{{.EXTENSION_DIR}}" && npm run dev

  tinycast:extension:
    desc: Build the IDL Docker extension for import into Tinycast
    summary: |
      Installs dependencies and builds a command bundle in the checkout running this task.
      After deploying dotfiles, run `dotfiles dot:tinycast:extension` to build it
      under ~/.dotfiles. Builds from a development checkout stay in that checkout.
      The output is not stowed to ~/.config/tinycast/extensions/idl-docker.
      In Tinycast Settings > Extensions, enable extensions and choose Add from folder.
      Select the absolute build directory printed by this task.
    vars:
      EXTENSION_DIR: '{{.ROOT_DIR}}/packages/tinycast/.config/tinycast/extensions/idl-docker'
    preconditions:
      - sh: command -v npm >/dev/null 2>&1
        msg: "npm is not installed. Install Node.js first."
      - sh: test -f "{{.EXTENSION_DIR}}/package.json"
        msg: "Tinycast extension not found at {{.EXTENSION_DIR}}"
    cmds:
      - cd "{{.EXTENSION_DIR}}" && npm ci
      - cd "{{.EXTENSION_DIR}}" && npm run build
      - 'echo "Tinycast import folder (from this checkout): {{.EXTENSION_DIR}}/build"'

  tinycast:utilities:
    desc: Build Developer Utilities for Tinycast
    summary: |
      Builds Clean Node Modules, Git Standup, Open Worktree, and GenAI AWS SSO
      commands in the active checkout.
      After deploying dotfiles, run `dotfiles dot:tinycast:utilities`, then import
      the printed build folder in Tinycast Settings > Extensions.
    vars:
      EXTENSION_DIR: '{{.ROOT_DIR}}/packages/tinycast/.config/tinycast/extensions/developer-utilities'
    preconditions:
      - sh: command -v npm >/dev/null 2>&1
        msg: "npm is not installed. Install Node.js first."
      - sh: test -f "{{.EXTENSION_DIR}}/package.json"
        msg: "Developer Utilities extension not found at {{.EXTENSION_DIR}}"
    cmds:
      - cd "{{.EXTENSION_DIR}}" && npm ci
      - cd "{{.EXTENSION_DIR}}" && npm run build
      - 'echo "Tinycast import folder (from this checkout): {{.EXTENSION_DIR}}/build"'

  tinycast:extensions:
    desc: Build both Tinycast extensions for import
    cmds:
      - task: tinycast:extension
      - task: tinycast:utilities

  # ============================================================================
  # Health Check / Doctor Tasks
  # ============================================================================

  doctor:
    desc: Check dotfiles health and integrity
    summary: |
      Runs comprehensive checks on dotfiles:
      - Verifies stowed symlinks point to correct locations
      - Finds broken symlinks in home directory
      - Checks for required directories
      - Validates .local template files exist

      Run this if something seems wrong with your dotfiles
    cmds:
      - task: doctor:symlinks
      - task: doctor:broken_links
      - task: doctor:directories
      - task: doctor:templates

  doctor:symlinks:
    desc: Check stowed symlinks integrity
    internal: true
    silent: true
    vars:
      STOWED_COUNT:
        sh: find ~ -maxdepth 3 -type l -lname "*/.dotfiles/*" 2>/dev/null | wc -l | tr -d ' '
    cmds:
      - echo "🔍 Checking stowed symlinks..."
      - |
        if [[ "{{.STOWED_COUNT}}" -eq 0 ]]; then
          echo "⚠️  No dotfiles symlinks found - run 'task dot:install' first"
        else
          echo "✓ Found {{.STOWED_COUNT}} stowed symlink(s)"
        fi

  doctor:broken_links:
    desc: Check for broken symlinks
    internal: true
    silent: true
    cmds:
      - echo "🔍 Checking for broken symlinks..."
      - |
        BROKEN=$(find ~ -maxdepth 3 -type l ! -exec test -e {} \; -print 2>/dev/null | wc -l | tr -d ' ')
        if [[ "$BROKEN" -eq 0 ]]; then
          echo "✓ No broken symlinks found"
        else
          echo "⚠️  Found $BROKEN broken symlink(s) - run 'task clean:dead_symlinks' for details"
        fi

  doctor:directories:
    desc: Check required directories exist
    internal: true
    silent: true
    cmds:
      - echo "🔍 Checking required directories..."
      - |
        MISSING=0
        for dir in ~/.config ~/.ssh ~/.local/bin ~/.local/share; do
          if [[ ! -d "$dir" ]]; then
            echo "  ✗ Missing: $dir"
            MISSING=$((MISSING + 1))
          fi
        done
        if [[ $MISSING -eq 0 ]]; then
          echo "✓ All required directories exist"
        else
          echo "⚠️  $MISSING director(ies) missing - run 'task dot:install' to create them"
        fi

  doctor:templates:
    desc: Verify .local template files
    internal: true
    silent: true
    cmds:
      - echo "🔍 Checking .local template files..."
      - |
        MISSING=0
        while IFS= read -r file; do
          if [[ ! -f "{{.PACKAGES_DIR}}/$file" ]]; then
            echo "  ✗ Template missing: $file"
            MISSING=$((MISSING + 1))
          fi
        done < <(cd {{.PACKAGES_DIR}} && find . -type f -name "*.local" | sed 's|^\./||')

        if [[ $MISSING -eq 0 ]]; then
          echo "✓ All template files found"
        else
          echo "⚠️  $MISSING template(s) missing"
        fi
