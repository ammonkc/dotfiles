# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: 3

vars:
  DOTFILES: "{{.ROOT_DIR}}"
  # Third-party taps. Current Homebrew refuses to load formulae from untrusted taps, so the
  # taps a Brewfile uses are trusted before it is bundled. Core installs only touch the core
  # taps; the full profile and brew:retry add the rest. When a Brewfile adds a tap, add it
  # here too: tests/brew-trust-taps.sh fails if one is missing.
  TRUSTED_TAPS_CORE: modem-dev/tap
  TRUSTED_TAPS_FULL: abue-ammar/tinycast driceroland/tap dufu1991/tap lab421/tap momenbasel/pesty saffsanity/sill shivammathur/extensions shivammathur/php stablyai/orca tweakphp/tap xykong/tap

tasks:
  # ============================================================================
  # Primary Tasks
  # ============================================================================

  install:
    platforms: [darwin]
    desc: Install Homebrew and tools defined in Brewfile
    preconditions:
      - sh: test "$(uname -m)" = arm64
        msg: "macOS setup requires Apple Silicon and a native arm64 shell"
    cmds:
      - task: install:homebrew
      - task: install:gnu_stow

  trust:taps:
    platforms: [darwin]
    silent: true
    desc: Trust the third-party Homebrew taps used by the Brewfiles
    summary: |
      Taps and trusts the taps brew bundle needs so it may load their formulae. The core taps
      are always trusted; the full taps are added unless PROFILE (default: DOTFILES_PROFILE,
      then full) is core. A tap that cannot be added or trusted is reported and skipped, and
      brew bundle then reports the packages that need it. Skipped on Homebrew versions without
      brew trust.
    vars:
      PROFILE: '{{.PROFILE | default (env "DOTFILES_PROFILE") | default "full"}}'
    cmds:
      - |
        set -e
        export PATH="{{.BREW_PREFIX}}/bin:{{.BREW_PREFIX}}/sbin:$PATH"
        brew_bin="${BREW_BIN:-brew}"
        if ! "$brew_bin" trust --help >/dev/null 2>&1; then
          echo "brew trust is not available; skipping tap trust"
          exit 0
        fi
        taps="{{.TRUSTED_TAPS_CORE}}"
        if [ "{{.PROFILE}}" != core ]; then
          taps="$taps {{.TRUSTED_TAPS_FULL}}"
        fi
        for tap in $taps; do
          if ! "$brew_bin" tap "$tap" || ! "$brew_bin" trust --tap "$tap"; then
            echo "Warning: could not tap and trust $tap; formulae and casks from it may fail to install" >&2
          fi
        done

  upgrade:
    platforms: [darwin]
    desc: Update Homebrew and upgrade all installed packages
    preconditions:
      - sh: test "$(uname -m)" = arm64
        msg: "macOS setup requires Apple Silicon and a native arm64 shell"
    cmds:
      - brew update
      - brew upgrade
      # - task: update

  update:
    platforms: [darwin]
    desc: Update Brewfile with current brew packages and commit changes
    preconditions:
      - sh: test "$(uname -m)" = arm64
        msg: "macOS setup requires Apple Silicon and a native arm64 shell"
    cmds:
      - task: update_no_commit
      - task: commit

  cleanup:
    desc: Remove unused brew dependencies
    platforms: [darwin]
    preconditions:
      - sh: test "$(uname -m)" = arm64
        msg: "macOS setup requires Apple Silicon and a native arm64 shell"
    cmds:
      - brew cleanup
      - brew autoremove

  retry:
    desc: Retry failed Homebrew package installations
    summary: |
      Retries installing packages from Brewfile
      Useful after network failures or interrupted installations
    platforms: [darwin]
    preconditions:
      - sh: test "$(uname -m)" = arm64
        msg: "macOS setup requires Apple Silicon and a native arm64 shell"
    dir: "/{{.DOTFILES}}"
    silent: true
    cmds:
      - task: trust:taps
        vars:
          PROFILE: full
      - |
        set -e
        export PATH="{{.BREW_PREFIX}}/bin:{{.BREW_PREFIX}}/sbin:$PATH"
        brew bundle --file="{{.DOTFILES}}/Brewfile"
        state_dir="${XDG_STATE_HOME:-$HOME/.local/state}/dotfiles"
        mkdir -p "$state_dir"
        touch "$state_dir/full-brew-complete"
        rm -f "$state_dir/full-brew-pending"
        # Free the download cache between stages; small disks cannot hold every installer.
        brew cleanup --prune=all || echo "Warning: brew cleanup failed; the download cache was not cleared" >&2

  # ============================================================================
  # Internal Tasks
  # ============================================================================

  install:homebrew:
    internal: true
    silent: true
    platforms: [darwin]
    preconditions:
      - sh: test "$(uname -m)" = arm64
        msg: "macOS setup requires Apple Silicon and a native arm64 shell"
    status:
      - test -x "{{.BREW_PREFIX}}/bin/brew"
    cmds:
      - |
        # Refresh sudo timestamp to ensure it's still valid
        sudo -v
      - NONINTERACTIVE=1 bash "{{.DOTFILES}}/scripts/download-installer.sh" https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh
      - eval "$({{.BREW_PREFIX}}/bin/brew shellenv)"

  install:gnu_stow:
    internal: true
    silent: true
    platforms: [darwin]
    # NOTE: the leading slash here is a bit annoying, but required due to a bug
    # in go-task see https://github.com/go-task/task/issues/828
    dir: "/{{.DOTFILES}}"
    deps:
      - install:homebrew
    cmds:
      - |
        export PATH="{{.BREW_PREFIX}}/bin:{{.BREW_PREFIX}}/sbin:$PATH"
        brew install stow

  install:tools:
    internal: true
    platforms: [darwin]
    # NOTE: the leading slash here is a bit annoying, but required due to a bug
    # in go-task see https://github.com/go-task/task/issues/828
    dir: "/{{.DOTFILES}}"
    deps:
      - install:homebrew
    cmds:
      - task: trust:taps
      - |
        set -e
        export PATH="{{.BREW_PREFIX}}/bin:{{.BREW_PREFIX}}/sbin:$PATH"
        brew bundle --file="{{.DOTFILES}}/Brewfile.core"
        # Free the download cache between stages; small disks cannot hold every installer.
        brew cleanup --prune=all || echo "Warning: brew cleanup failed; the download cache was not cleared" >&2
        case "${DOTFILES_PROFILE:-full}" in
          core) ;;
          full)
            state_dir="${XDG_STATE_HOME:-$HOME/.local/state}/dotfiles"
            mkdir -p "$state_dir"
            if brew bundle --file="{{.DOTFILES}}/Brewfile"; then
              touch "$state_dir/full-brew-complete"
              rm -f "$state_dir/full-brew-pending"
            else
              rm -f "$state_dir/full-brew-complete"
              touch "$state_dir/full-brew-pending"
              echo "Full Homebrew bundle is incomplete. Retry with: task brew:retry" >&2
            fi
            ;;
          *) echo "DOTFILES_PROFILE must be core or full" >&2; exit 1 ;;
        esac
        brew cleanup --prune=all || echo "Warning: brew cleanup failed; the download cache was not cleared" >&2

  update_no_commit:
    internal: true
    platforms: [darwin]
    # NOTE: the leading slash here is a bit annoying, but required due to a bug
    # in go-task see https://github.com/go-task/task/issues/828
    dir: "/{{.DOTFILES}}"
    cmds:
      - brew bundle dump --force --describe

  commit:
    desc: Commits the Brewfile file if changed
    internal: true
    silent: true
    # NOTE: the leading slash here is a bit annoying, but required due to a bug
    # in go-task see https://github.com/go-task/task/issues/828
    dir: "/{{.DOTFILES}}"
    cmd: |
      ./scripts/commit_changed_file.sh \
        'Brewfile' \
        "chore(brew): update packages $(date '+%Y-%m-%d %H:%M:%S')"
