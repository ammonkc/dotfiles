# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: 3

vars:
  DOTFILES: "{{.ROOT_DIR}}"
  BREW_PREFIX: /opt/homebrew

tasks:
  # ============================================================================
  # Primary Tasks
  # ============================================================================

  install:
    platforms: [darwin]
    desc: Install Homebrew and tools defined in Brewfile
    preconditions:
      - sh: test "$(uname -m)" = arm64
        msg: "macOS setup requires Apple Silicon and a native arm64 shell"
    cmds:
      - task: install:homebrew
      - task: install:gnu_stow

  upgrade:
    platforms: [darwin]
    desc: Update Homebrew and upgrade all installed packages
    preconditions:
      - sh: test "$(uname -m)" = arm64
        msg: "macOS setup requires Apple Silicon and a native arm64 shell"
    cmds:
      - brew update
      - brew upgrade
      # - task: update

  update:
    platforms: [darwin]
    desc: Update Brewfile with current brew packages and commit changes
    preconditions:
      - sh: test "$(uname -m)" = arm64
        msg: "macOS setup requires Apple Silicon and a native arm64 shell"
    cmds:
      - task: update_no_commit
      - task: commit

  cleanup:
    desc: Remove unused brew dependencies
    platforms: [darwin]
    preconditions:
      - sh: test "$(uname -m)" = arm64
        msg: "macOS setup requires Apple Silicon and a native arm64 shell"
    cmds:
      - brew cleanup
      - brew autoremove

  retry:
    desc: Retry failed Homebrew package installations
    summary: |
      Retries installing packages from Brewfile
      Useful after network failures or interrupted installations
    platforms: [darwin]
    preconditions:
      - sh: test "$(uname -m)" = arm64
        msg: "macOS setup requires Apple Silicon and a native arm64 shell"
    dir: "/{{.DOTFILES}}"
    silent: true
    cmds:
      - |
        set -e
        export PATH="{{.BREW_PREFIX}}/bin:{{.BREW_PREFIX}}/sbin:$PATH"
        brew bundle --file="{{.DOTFILES}}/Brewfile"
        state_dir="${XDG_STATE_HOME:-$HOME/.local/state}/dotfiles"
        mkdir -p "$state_dir"
        touch "$state_dir/full-brew-complete"
        rm -f "$state_dir/full-brew-pending"

  # ============================================================================
  # Internal Tasks
  # ============================================================================

  install:homebrew:
    internal: true
    silent: true
    platforms: [darwin]
    preconditions:
      - sh: test "$(uname -m)" = arm64
        msg: "macOS setup requires Apple Silicon and a native arm64 shell"
    status:
      - which brew
    cmds:
      - |
        # Refresh sudo timestamp to ensure it's still valid
        sudo -v
      - NONINTERACTIVE=1 bash "{{.DOTFILES}}/scripts/download-installer.sh" https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh
      - eval "$({{.BREW_PREFIX}}/bin/brew shellenv)"

  install:gnu_stow:
    internal: true
    silent: true
    platforms: [darwin]
    # NOTE: the leading slash here is a bit annoying, but required due to a bug
    # in go-task see https://github.com/go-task/task/issues/828
    dir: "/{{.DOTFILES}}"
    deps:
      - install:homebrew
    cmds:
      - |
        export PATH="{{.BREW_PREFIX}}/bin:{{.BREW_PREFIX}}/sbin:$PATH"
        brew install stow

  install:tools:
    internal: true
    platforms: [darwin]
    # NOTE: the leading slash here is a bit annoying, but required due to a bug
    # in go-task see https://github.com/go-task/task/issues/828
    dir: "/{{.DOTFILES}}"
    deps:
      - install:homebrew
    cmds:
      - |
        set -e
        export PATH="{{.BREW_PREFIX}}/bin:{{.BREW_PREFIX}}/sbin:$PATH"
        brew bundle --file="{{.DOTFILES}}/Brewfile.core"
        case "${DOTFILES_PROFILE:-full}" in
          core) ;;
          full)
            state_dir="${XDG_STATE_HOME:-$HOME/.local/state}/dotfiles"
            mkdir -p "$state_dir"
            if brew bundle --file="{{.DOTFILES}}/Brewfile"; then
              touch "$state_dir/full-brew-complete"
              rm -f "$state_dir/full-brew-pending"
            else
              rm -f "$state_dir/full-brew-complete"
              touch "$state_dir/full-brew-pending"
              echo "Full Homebrew bundle is incomplete. Retry with: task brew:retry" >&2
            fi
            ;;
          *) echo "DOTFILES_PROFILE must be core or full" >&2; exit 1 ;;
        esac

  update_no_commit:
    internal: true
    platforms: [darwin]
    # NOTE: the leading slash here is a bit annoying, but required due to a bug
    # in go-task see https://github.com/go-task/task/issues/828
    dir: "/{{.DOTFILES}}"
    cmds:
      - brew bundle dump --force --describe

  commit:
    desc: Commits the Brewfile file if changed
    internal: true
    silent: true
    # NOTE: the leading slash here is a bit annoying, but required due to a bug
    # in go-task see https://github.com/go-task/task/issues/828
    dir: "/{{.DOTFILES}}"
    cmd: |
      ./scripts/commit_changed_file.sh \
        'Brewfile' \
        "chore(brew): update packages $(date '+%Y-%m-%d %H:%M:%S')"
