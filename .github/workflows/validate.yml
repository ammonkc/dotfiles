name: Validate dotfiles
on:
  push:
  pull_request:
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y stow shellcheck jq zsh rsync
      - name: Shell and Taskfile checks
        run: |
          bash -n bin/install scripts/bootstrap.sh scripts/download-installer.sh scripts/macos.sh scripts/macos-preview.sh scripts/secret-block.sh scripts/install-status.sh packages/bin/.local/bin/idl-up packages/bin/.local/bin/idl-down packages/bin/.local/bin/idl-worktree-setup packages/bin/.local/lib/git-worktree.sh packages/tinycast/.config/tinycast/script-commands/idl-up.sh packages/tinycast/.config/tinycast/script-commands/idl-down.sh packages/raycast/.config/raycast/script-commands/idl-up.sh packages/raycast/.config/raycast/script-commands/idl-down.sh tests/bootstrap-helpers.sh tests/architecture.sh tests/macos-defaults.sh tests/worktree-compat.sh tests/idl-tinycast-wrappers.sh tests/idl-profiles.sh tests/stow-extension-ignore.sh tests/idl-zed-worktree-setup.sh
          shellcheck -S warning bin/install scripts/bootstrap.sh scripts/download-installer.sh scripts/secret-block.sh scripts/install-status.sh
          task --list >/dev/null
          bash tests/bootstrap-helpers.sh
          bash tests/architecture.sh
          bash tests/macos-defaults.sh
          bash tests/neovim-failure.sh
          zsh -n packages/zsh/.config/zsh/functions/set_poshcontext
          bash tests/posh-context.sh
          bash tests/worktree-compat.sh
          bash tests/idl-tinycast-wrappers.sh
          bash tests/idl-profiles.sh
          bash tests/stow-extension-ignore.sh
          bash tests/idl-zed-worktree-setup.sh
      - name: Stow dry run
        run: |
          target="$(mktemp -d)"
          trap 'rm -rf "$target"' EXIT
          mkdir -p "$target/.config" "$target/.local"
          for package in packages/*; do
            test -d "$package" || continue
            stow -n --no-folding -d packages -t "$target" "$(basename "$package")"
          done
      - name: Tinycast Developer Utilities
        working-directory: packages/tinycast/.config/tinycast/extensions/developer-utilities
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm test
          npm run build
      - name: Shared Raycast Developer Utilities source
        run: test "$(realpath packages/raycast/extensions/developer-utilities)" = "$(realpath packages/tinycast/.config/tinycast/extensions/developer-utilities)"
      - name: Tinycast IDL Docker
        working-directory: packages/tinycast/.config/tinycast/extensions/idl-docker
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run build
      - name: Raycast IDL Docker
        working-directory: packages/raycast/extensions/idl-docker
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm run build
