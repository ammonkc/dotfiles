name: Validate dotfiles
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: false
      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck zsh
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - uses: arduino/setup-task@v3
      - run: task lint
      - run: actionlint
      - run: task --list
  dotfiles:
    name: ${{ matrix.suite }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        suite: [shell, stow, config]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - uses: arduino/setup-task@v3
      - name: Install Linux validation tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y stow jq zsh rsync ripgrep
          sudo locale-gen en_US.UTF-8
      - name: Install macOS validation tools
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          brew install stow jq zsh rsync ripgrep
      - run: python3 -m pip install -r tests/requirements.txt
      - run: task test:${{ matrix.suite }}
  extensions:
    name: Extension (${{ matrix.extension }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        extension:
          - packages/tinycast/.config/tinycast/extensions/developer-utilities
          - packages/tinycast/.config/tinycast/extensions/obsidian-prompts
          - packages/tinycast/.config/tinycast/extensions/idl-docker
          - packages/raycast/extensions/idl-docker
    defaults:
      run:
        working-directory: ${{ matrix.extension }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.extension }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
  window-edges:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/tinycast/.config/tinycast/extensions/window-edges
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/tinycast/.config/tinycast/extensions/window-edges/package-lock.json
      - run: test "$(uname -m)" = arm64
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
